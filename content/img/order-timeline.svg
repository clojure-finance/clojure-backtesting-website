<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">From order to fill</title>
  <desc id="d">On 1990-01-02 the strategy calls order for 50 shares of 10001, which becomes a pending order. Calling next-date moves to 1990-01-03, where the backtester updates indicators, charges loan interest, revalues holdings, checks whether the run must end, fills the pending order at that day's close of 50.81 dollars, and runs automations. Then the strategy runs again.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <g font-size="13">
    <!-- Day labels -->
    <text x="20" y="24" font-weight="700" fill="#0f172a">1990-01-02</text>
    <text x="20" y="42" font-size="12" fill="#64748b">today</text>
    <text x="330" y="24" font-weight="700" fill="#0f172a">1990-01-03</text>
    <text x="330" y="42" font-size="12" fill="#64748b">the next trading day</text>

    <!-- Day 1 -->
    <rect x="20" y="58" width="250" height="84" rx="10" fill="#f6f8fb" stroke="#d5dde8"/>
    <text x="34" y="82" font-weight="600" fill="#0f172a">Your strategy runs</text>
    <text x="34" y="106" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" fill="#1d4fb8">(order "10001" 50)</text>
    <text x="34" y="128" font-size="12" fill="#64748b">placed after seeing today's close</text>
    <line x1="145" y1="144" x2="145" y2="170" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="20" y="174" width="250" height="56" rx="10" fill="#fff7e6" stroke="#f0c36d"/>
    <text x="34" y="198" font-weight="600" fill="#8a5a00">Pending order</text>
    <text x="34" y="218" font-size="12" fill="#8a5a00">not filled yet, portfolio unchanged</text>
    <line x1="145" y1="232" x2="145" y2="262" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="20" y="266" width="250" height="44" rx="10" fill="#0f172a"/>
    <text x="34" y="293" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#e2e8f0">(next-date)</text>
    <path d="M272 288 H298 V70 H322" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

    <!-- Day 2: what next-date does -->
    <rect x="326" y="52" width="414" height="232" rx="12" fill="#eef4fe" stroke="#bcd0f2"/>
    <text x="342" y="76" font-weight="700" fill="#1d4fb8">What next-date does, in order</text>
    <g font-size="12.5" fill="#334155">
      <text x="342" y="104"><tspan font-weight="700" fill="#1d4fb8">1</tspan>  Move the date pointer and update indicators</text>
      <text x="342" y="130"><tspan font-weight="700" fill="#1d4fb8">2</tspan>  Charge interest on any loan</text>
      <text x="342" y="156"><tspan font-weight="700" fill="#1d4fb8">3</tspan>  Revalue holdings (dividends, splits, delistings)</text>
      <text x="342" y="182"><tspan font-weight="700" fill="#1d4fb8">4</tspan>  End the run if needed (last date, value below 0, margin call)</text>
    </g>
    <rect x="336" y="194" width="394" height="40" rx="8" fill="#e8f6ee" stroke="#9fd8b5"/>
    <text x="342" y="219" font-size="12.5" fill="#14532d"><tspan font-weight="700">5</tspan>  Fill pending orders at today's close: <tspan font-weight="700">50 shares at $50.81</tspan></text>
    <text x="342" y="260" font-size="12.5" fill="#334155"><tspan font-weight="700" fill="#1d4fb8">6</tspan>  Run automations (stop-loss rules and the like)</text>
    <line x1="533" y1="286" x2="533" y2="304" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="533" y="322" font-weight="600" fill="#0f172a" text-anchor="middle">Your strategy runs again, on 1990-01-03</text>
  </g>
</svg>
